<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 250px;
      padding: 12px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f5f7;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: #333;
      text-align: center;
    }
    #groupList { display: flex; flex-direction: column; gap: 6px; }
    .group-btn {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      color: #ffffff;
      text-shadow: 0 1px 1px rgba(0,0,0,0.18);
      transition: opacity 0.15s, transform 0.05s;
    }
    .group-btn:hover { opacity: 0.9; }
    .group-btn:active { transform: scale(0.98); }
    .group-btn.light-text { color: #202124; text-shadow: none; }

    .parent-btn { display: flex; justify-content: space-between; align-items: center; }
    .parent-btn .arrow { font-size: 11px; opacity: 0.9; }

    .sub-menu {
      display: none;
      margin: 0 0 6px 0;
      padding-left: 10px;
      border-left: 3px solid #ccc;
    }
    .sub-menu.open { display: block; }
    .sub-btn {
      width: 100%;
      padding: 7px 10px;
      margin-bottom: 4px;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      color: #202124;
      transition: opacity 0.15s;
    }
    .sub-btn:hover { opacity: 0.85; }

    .empty-msg {
      text-align: center;
      color: #777;
      font-size: 12px;
      padding: 16px 6px;
      font-style: italic;
    }
    .settings-btn {
      width: 100%;
      margin-top: 10px;
      padding: 8px 12px;
      background: transparent;
      color: #605e5c;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      border: 1px dashed #c8c6c4;
      border-radius: 4px;
      cursor: pointer;
    }
    .settings-btn:hover { background-color: #e1dfdd; color: #323130; }
  </style>
</head>
<body>
  <h3>Select Ticket Type</h3>
  <div id="groupList"></div>
  <button id="openOptionsBtn" class="settings-btn">⚙ Edit Saved URLs</button>
  <script src="popup.js"></script>
</body>
</html>
